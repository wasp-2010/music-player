<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music player</title>
    <!-- Include jsmediatags to parse embedded album art/metadata from audio files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        /* Default Dark Theme Variables */
        :root {
            --bg-base: #111;
            --bg-card: #181818;
            --bg-hover: #282828;
            --turntable-bg: #111;
            --accent: #ff4747;
            --text-main: #eee;
            --text-sub: #888;
            --border-color: #222;
        }

        /* Light Theme Variables */
        body.light-mode {
            --bg-base: #f4f4f6;
            --bg-card: #ffffff;
            --bg-hover: #e5e5ea;
            --turntable-bg: #f4f4f6;
            --accent: #ff3b30;
            --text-main: #111111;
            --text-sub: #666666;
            --border-color: #d1d1d6;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Generic text input (used by the new-playlist form) */
        .text-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .text-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Left Column: The Turntable */
        .turntable-section {
            width: 50%;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: background 0.3s;
        }

        #vinylCanvas {
            position: absolute;
            left: -280px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            border-radius: 50%;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            touch-action: none;
        }
        #vinylCanvas.is-dragging { cursor: grabbing; }

        .now-playing-label {
            display: none;
        }

        /* Turntable Arm / Needle Graphic */
        .tonearm-assembly {
            position: absolute;
            top: 11%;
            right: 68px;
            width: 0;
            height: 0;
            z-index: 5;
            pointer-events: none;
        }

        .tonearm-base {
            position: absolute;
            top: -26px;
            left: -26px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #4a4a4a, #1c1c1c 70%);
            box-shadow: 0 6px 14px rgba(0,0,0,0.5);
        }

        .tonearm-pivot {
            position: absolute;
            top: -18px;
            left: -18px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #f0f0f0, #999 55%, #333 100%);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
        }
        .tonearm-pivot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #161616;
            transform: translate(-50%, -50%);
        }

        .tonearm-arm {
            position: absolute;
            top: -4px;
            right: 0;
            width: 226px;
            height: 8px;
            background: linear-gradient(180deg, #efefef, #9c9c9c 45%, #5a5a5a);
            border-radius: 4px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.45);
            transform-origin: right center;
            transform: rotate(38deg);
            transition: transform 0.8s cubic-bezier(.34, 1.1, .35, 1);
        }
        .tonearm-arm.is-playing {
            transform: rotate(10deg);
        }

        .tonearm-counterweight {
            position: absolute;
            right: -8px;
            top: -9px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #8f8f8f, #2a2a2a 75%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .tonearm-headshell {
            position: absolute;
            left: -12px;
            top: -7px;
            width: 28px;
            height: 18px;
            background: linear-gradient(135deg, #3d3d3d, #131313);
            border-radius: 3px 3px 7px 7px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .tonearm-needle {
            position: absolute;
            left: 3px;
            bottom: -7px;
            width: 2px;
            height: 9px;
            background: linear-gradient(180deg, #e2e2e2, #8f8f8f);
            border-radius: 1px;
        }

        /* Right Column: Navigation & Content */
        .content-section {
            width: 50%;
            padding: 30px 30px 140px 30px;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            transition: background 0.3s;
            box-sizing: border-box;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--text-main);
            color: var(--bg-base);
            border-color: var(--text-main);
        }
        .tab-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        /* Pill Import Button */
        .import-pill-btn {
            background: #f0f0f2;
            color: #111;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.15s, background 0.2s;
        }
        body.light-mode .import-pill-btn {
            background: #e5e5ea;
            color: #111;
        }
        .import-pill-btn:hover {
            transform: scale(1.03);
            background: var(--accent);
            color: #fff;
        }
        .hidden-file-input { display: none; }

        /* Small Circle Theme Toggle Button */
        .theme-circle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .theme-circle-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent);
        }

        /* Dynamic View Container */
        .view-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            background: var(--bg-base);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, border-color 0.3s;
        }

        .view-pane { display: none; flex: 1; flex-direction: column; }
        .view-pane.active { display: flex; }

        /* Search Input */
        .search-input {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-sizing: border-box;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: width 0.3s ease, border-radius 0.3s ease, padding 0.3s ease, transform 0.2s, border-color 0.2s;
            outline: none;
        }
        
        .search-input::placeholder {
            color: var(--text-main);
            opacity: 1;
        }

        .search-input:focus {
            width: 100%;
            height: 40px;
            padding: 10px 15px;
            border-radius: 8px;
            border-color: var(--accent);
            cursor: text;
            text-align: left;
        }

        .search-input:focus::placeholder {
            color: var(--text-sub);
            opacity: 0.7;
        }

        /* Track List Items */
        .track-list {
            flex: 1;
            overflow-y: auto;
        }

        .list-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .list-item:hover { background: var(--bg-hover); }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.9rem;
        }
        .delete-btn:hover { color: var(--accent); }

        /* Floating Pill Player Widget */
        .floating-pill-player {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(24, 24, 24, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 16px 24px 16px 80px;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1000;
            color: #fff;
            transition: background 0.3s, border-color 0.3s;
            overflow: visible;
        }

        body.light-mode .floating-pill-player {
            background: rgba(255, 255, 255, 0.95);
            color: #111;
        }

        .fpp-artwork-container {
            position: absolute;
            left: -55px;
            top: 50%;
            transform: translateY(-50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            box-shadow: -5px 5px 20px rgba(0,0,0,0.5);
            cursor: grab;
            touch-action: none;
        }
        .fpp-artwork-container.is-dragging { cursor: grabbing; }

        #fppVinylCanvas {
            border-radius: 50%;
            display: block;
        }

        .fpp-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .fpp-top-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .fpp-title {
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fpp-subtitle {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fpp-seek-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .fpp-seekbar {
            width: 100%;
            -webkit-appearance: none;
            background: #444;
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .fpp-times {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .fpp-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .fpp-btn {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            opacity: 0.8;
            transition: opacity 0.15s, transform 0.15s, color 0.15s;
        }
        .fpp-btn:hover {
            opacity: 1;
            color: var(--accent);
            transform: scale(1.1);
        }

        .fpp-play-btn {
            background: var(--text-main);
            color: var(--bg-base);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            opacity: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .fpp-play-btn:hover {
            background: var(--accent);
            color: #fff;
            transform: scale(1.05);
        }

        .fpp-volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }
        .fpp-volume-slider {
            width: 60px;
            -webkit-appearance: none;
            background: #444;
            height: 3px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            margin-top: 30px;
        }

        /* Playlist Toolbar & New Playlist Form */
        .playlist-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .new-playlist-form {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
            min-width: 220px;
        }
        .new-playlist-form.hidden { display: none; }
        .new-playlist-form .text-input {
            width: auto;
            flex: 1;
            padding: 8px 12px;
        }
        .new-playlist-form .create-playlist-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .new-playlist-form .create-playlist-btn:hover { opacity: 0.9; }

        /* Playlist Cards */
        .playlist-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .playlist-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .playlist-card-title {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-width: 0;
        }

        .playlist-name {
            font-weight: bold;
            color: var(--accent);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .playlist-count {
            font-size: 0.8rem;
            color: var(--text-sub);
            white-space: nowrap;
        }

        .playlist-card-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .pl-play-btn, .pl-delete-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.15s;
        }
        .pl-play-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .pl-delete-btn:hover { color: var(--accent); border-color: var(--accent); }
        .pl-play-btn:disabled { opacity: 0.4; cursor: default; }
        .pl-play-btn:disabled:hover { background: transparent; color: var(--text-main); border-color: var(--border-color); }

        .playlist-tracks { display: flex; flex-direction: column; }
        .playlist-empty { margin: 10px 0; font-size: 0.85rem; }

        /* Library Track Row Actions */
        .track-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-to-playlist-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .add-to-playlist-btn:hover { color: var(--accent); }

        .list-item.active {
            background: var(--bg-hover);
            box-shadow: inset 3px 0 0 var(--accent);
        }

        /* Add-to-Playlist Popup Menu */
        .playlist-menu {
            position: fixed;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            min-width: 180px;
            max-width: 240px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 3000;
            padding: 6px;
        }

        .playlist-menu-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-menu-item:hover { background: var(--bg-hover); }
        .playlist-menu-item.already-added { color: var(--text-sub); }
        .playlist-menu-new {
            color: var(--accent);
            font-weight: bold;
            border-top: 1px solid var(--border-color);
            margin-top: 4px;
            padding-top: 8px;
        }
        .playlist-menu-empty {
            padding: 8px 10px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100vh;
                overflow-y: auto;
            }
            .turntable-section {
                width: 100%;
                height: 280px;
                min-height: 280px;
            }
            .tonearm-assembly {
                display: none;
            }
            #vinylCanvas {
                left: 50%;
                transform: translateX(-50%);
            }
            .content-section {
                width: 100%;
                height: auto;
                flex: 1;
                padding: 15px 15px 130px 15px;
            }
            .floating-pill-player {
                left: 10px;
                right: 10px;
                width: auto;
                bottom: 15px;
                padding: 14px 16px 14px 75px;
            }
        }
    </style>
</head>
<body>

    <!-- LEFT: TURNTABLE WITH BIG VINYL -->
    <div class="turntable-section">
        <canvas id="vinylCanvas" width="720" height="720"></canvas>
        <div class="tonearm-assembly">
            <div class="tonearm-base"></div>
            <div class="tonearm-pivot"></div>
            <div class="tonearm-arm" id="tonearmArm">
                <div class="tonearm-counterweight"></div>
                <div class="tonearm-headshell">
                    <div class="tonearm-needle"></div>
                </div>
            </div>
        </div>
        <div class="now-playing-label" id="nowPlayingText"></div>
    </div>

    <!-- RIGHT: NAVIGATION TABS & CONTENT -->
    <div class="content-section">
        <div class="nav-header">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('library')">Library</button>
                <button class="tab-btn" onclick="switchTab('playlists')">Playlists</button>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <!-- Small Import Pill Button -->
                <label class="import-pill-btn">
                    + IMPORT MUSIC
                    <input type="file" id="fileInput" class="hidden-file-input" accept="audio/*" multiple>
                </label>
                <!-- Small Circle Theme Toggle Button -->
                <button class="theme-circle-btn" onclick="toggleTheme()" id="themeToggleBtn" title="Toggle Theme">☀️</button>
            </div>
        </div>

        <div class="view-container">
            <!-- LIBRARY VIEW -->
            <div id="libraryView" class="view-pane active">
                <!-- Search Input Bar -->
                <input type="text" id="searchInput" class="search-input" placeholder="🔍" oninput="filterLibrary()">

                <div id="libraryList" class="track-list">
                    <div class="empty-state">Your imported songs will appear here.</div>
                </div>
            </div>

            <!-- PLAYLISTS VIEW -->
            <div id="playlistsView" class="view-pane">
                <div class="playlist-toolbar">
                    <button class="import-pill-btn" id="newPlaylistToggleBtn" onclick="toggleNewPlaylistForm()">+ NEW PLAYLIST</button>
                    <div class="new-playlist-form hidden" id="newPlaylistForm">
                        <input type="text" id="newPlaylistNameInput" class="text-input" placeholder="Playlist name" onkeydown="if(event.key==='Enter'){submitNewPlaylist();}">
                        <button class="create-playlist-btn" onclick="submitNewPlaylist()">Create</button>
                    </div>
                </div>
                <div id="playlistsList" style="flex: 1; overflow-y: auto;">
                    <div class="empty-state">No playlists yet. Create one to get started.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING PILL PLAYER WIDGET -->
    <div class="floating-pill-player">
        <div class="fpp-artwork-container" id="fppArtworkContainer">
            <canvas id="fppVinylCanvas" width="130" height="130"></canvas>
        </div>
        <div class="fpp-content">
            <div class="fpp-top-info">
                <span class="fpp-title" id="fppTitle">No track playing</span>
                <span class="fpp-subtitle">WASP VINYL RECORDS</span>
            </div>
            <div class="fpp-seek-container">
                <input type="range" id="seekSlider" class="fpp-seekbar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
                <div class="fpp-times">
                    <span id="currentTimeText">0:00</span>
                    <span id="durationText">0:00</span>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="fpp-controls">
                    <button class="fpp-btn" onclick="playPrevTrack()" title="Previous">⏮</button>
                    <button class="fpp-btn fpp-play-btn" onclick="togglePlayPause()" id="fppPlayPauseBtn" title="Play/Pause">▶</button>
                    <button class="fpp-btn" onclick="playNextTrack()" title="Next">⏭</button>
                </div>
                <div class="fpp-volume-container">
                    <span style="font-size: 0.75rem;">🔊</span>
                    <input type="range" min="0" max="1" step="0.01" value="1" class="fpp-volume-slider" oninput="changeVolume(this.value)">
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioPlayer"></audio>

    <script>
        const canvas = document.getElementById('vinylCanvas');
        const ctx = canvas.getContext('2d');
        const fppCanvas = document.getElementById('fppVinylCanvas');
        const fppCtx = fppCanvas.getContext('2d');

        const audioPlayer = document.getElementById('audioPlayer');
        const fileInput = document.getElementById('fileInput');
        const searchInput = document.getElementById('searchInput');
        const libraryList = document.getElementById('libraryList');
        const playlistsList = document.getElementById('playlistsList');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const tonearmArm = document.getElementById('tonearmArm');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const fppTitle = document.getElementById('fppTitle');
        const fppPlayPauseBtn = document.getElementById('fppPlayPauseBtn');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeText = document.getElementById('currentTimeText');
        const durationText = document.getElementById('durationText');

        const CANVAS_SIZE = 720;
        const CENTER = CANVAS_SIZE / 2;
        const OUTER_RADIUS = 345;
        const LABEL_RADIUS = 105;

        let db = null;
        let tracks = [];
        let playlists = [];
        let currentTrackIndex = -1;
        let currentTrackId = null;
        let currentQueue = [];
        let currentQueueIndex = -1;
        let activePlaylistMenu = null;

        let isDragging = false;
        let lastAngle = 0;
        let lastTime = 0;
        let spinVelocity = 0;
        let currentRotation = 0;
        
        const NORMAL_SPEED_RAD = (Math.PI * 2) / 8; 
        let currentVinylImg = null;
        let lastFrameTime = performance.now();

        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('MusicPlayerDB', 2);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('tracks')) {
                        database.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true });
                    }
                    if (!database.objectStoreNames.contains('playlists')) {
                        database.createObjectStore('playlists', { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        function savePlaylistToDB(playlistData) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['playlists'], 'readwrite');
                const store = transaction.objectStore('playlists');
                const request = store.add(playlistData);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function updatePlaylistInDB(playlist) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['playlists'], 'readwrite');
                const store = transaction.objectStore('playlists');
                const request = store.put(playlist);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function deletePlaylistFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['playlists'], 'readwrite');
                const store = transaction.objectStore('playlists');
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function loadPlaylistsFromDB() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['playlists'], 'readonly');
                const store = transaction.objectStore('playlists');
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function init() {
            drawVinyl(0);
            drawMiniVinyl(0);
            setupAudioListeners();
            await initIndexedDB();
            loadLibraryData();
            requestAnimationFrame(mainLoop);
        }

        function saveTrackToDB(trackData) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['tracks'], 'readwrite');
                const store = transaction.objectStore('tracks');
                const request = store.add(trackData);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function loadLibraryData() {
            if (!db) return;
            const transaction = db.transaction(['tracks'], 'readonly');
            const store = transaction.objectStore('tracks');
            const request = store.getAll();

            request.onsuccess = () => {
                const allTracks = request.result;
                tracks = allTracks.map(t => {
                    const blob = new Blob([t.fileData], { type: t.fileType });
                    return {
                        id: t.id,
                        name: t.name,
                        cover: t.cover,
                        url: URL.createObjectURL(blob)
                    };
                });
                renderLibrary();

                loadPlaylistsFromDB().then(allPlaylists => {
                    playlists = allPlaylists;
                    renderPlaylists();
                });
            };
        }

        function deleteTrackFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['tracks'], 'readwrite');
                const store = transaction.objectStore('tracks');
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                themeToggleBtn.innerText = '🌙';
            } else {
                themeToggleBtn.innerText = '☀️';
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn !== themeToggleBtn) btn.classList.remove('active');
            });
            document.querySelectorAll('.view-pane').forEach(pane => pane.classList.remove('active'));

            if (tabName === 'library') {
                document.querySelector('.tab-buttons button:nth-child(1)').classList.add('active');
                document.getElementById('libraryView').classList.add('active');
            } else {
                document.querySelector('.tab-buttons button:nth-child(2)').classList.add('active');
                document.getElementById('playlistsView').classList.add('active');
            }
        }

        function drawVinyl(rotation) {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            ctx.save();
            ctx.translate(CENTER, CENTER);
            ctx.rotate(rotation);

            ctx.beginPath();
            ctx.arc(0, 0, OUTER_RADIUS, 0, Math.PI * 2);
            ctx.clip();

            if (currentVinylImg && currentVinylImg.complete) {
                ctx.drawImage(currentVinylImg, -OUTER_RADIUS, -OUTER_RADIUS, OUTER_RADIUS * 2, OUTER_RADIUS * 2);
            } else {
                ctx.fillStyle = '#111';
                ctx.fillRect(-OUTER_RADIUS, -OUTER_RADIUS, OUTER_RADIUS * 2, OUTER_RADIUS * 2);
            }
            ctx.restore();

            ctx.save();
            ctx.translate(CENTER, CENTER);
            ctx.rotate(rotation);

            ctx.beginPath();
            ctx.arc(0, 0, OUTER_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.fill();

            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            for(let i = LABEL_RADIUS + 15; i < OUTER_RADIUS - 10; i += 6) {
                ctx.beginPath();
                ctx.arc(0, 0, i, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, OUTER_RADIUS, 0, Math.PI * 2);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#222';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, LABEL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ddd';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.strokeStyle = '#444';
            ctx.stroke();
        }

        function drawMiniVinyl(rotation) {
            const size = 130;
            const center = size / 2;
            const outerR = 62;
            const labelR = 24;

            fppCtx.clearRect(0, 0, size, size);

            fppCtx.save();
            fppCtx.translate(center, center);
            fppCtx.rotate(rotation);

            fppCtx.beginPath();
            fppCtx.arc(0, 0, outerR, 0, Math.PI * 2);
            fppCtx.clip();

            if (currentVinylImg && currentVinylImg.complete) {
                fppCtx.drawImage(currentVinylImg, -outerR, -outerR, outerR * 2, outerR * 2);
            } else {
                fppCtx.fillStyle = '#111';
                fppCtx.fillRect(-outerR, -outerR, outerR * 2, outerR * 2);
            }
            fppCtx.restore();

            fppCtx.save();
            fppCtx.translate(center, center);
            fppCtx.rotate(rotation);

            fppCtx.beginPath();
            fppCtx.arc(0, 0, outerR, 0, Math.PI * 2);
            fppCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            fppCtx.fill();

            fppCtx.lineWidth = 1;
            fppCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            for(let i = labelR + 6; i < outerR - 4; i += 3) {
                fppCtx.beginPath();
                fppCtx.arc(0, 0, i, 0, Math.PI * 2);
                fppCtx.stroke();
            }
            fppCtx.restore();

            fppCtx.beginPath();
            fppCtx.arc(center, center, outerR, 0, Math.PI * 2);
            fppCtx.lineWidth = 1.5;
            fppCtx.strokeStyle = '#333';
            fppCtx.stroke();

            fppCtx.beginPath();
            fppCtx.arc(center, center, labelR, 0, Math.PI * 2);
            fppCtx.fillStyle = '#ffffff';
            fppCtx.fill();
            fppCtx.lineWidth = 1.5;
            fppCtx.strokeStyle = '#ddd';
            fppCtx.stroke();

            fppCtx.beginPath();
            fppCtx.arc(center, center, 4, 0, Math.PI * 2);
            fppCtx.fillStyle = '#111';
            fppCtx.fill();
            fppCtx.strokeStyle = '#444';
            fppCtx.stroke();
        }

        function setupAudioListeners() {
            audioPlayer.addEventListener('loadedmetadata', () => {
                audioPlayer.play();
                fppPlayPauseBtn.innerText = '⏸';
            });
            audioPlayer.addEventListener('play', () => {
                fppPlayPauseBtn.innerText = '⏸';
                tonearmArm.classList.add('is-playing');
            });
            audioPlayer.addEventListener('pause', () => {
                fppPlayPauseBtn.innerText = '▶';
                tonearmArm.classList.remove('is-playing');
            });
            audioPlayer.addEventListener('ended', playNextTrack);
        }

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function mainLoop(timestamp) {
            const deltaTime = (timestamp - lastFrameTime) / 1000;
            lastFrameTime = timestamp;

            if (audioPlayer.duration && !audioPlayer.paused && !isDragging) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                seekSlider.value = progressPercent;
                currentTimeText.innerText = formatTime(audioPlayer.currentTime);
                durationText.innerText = formatTime(audioPlayer.duration);
            }

            if (!isDragging) {
                if (Math.abs(spinVelocity) > 0.01) {
                    currentRotation += spinVelocity * deltaTime;
                    const targetVelocity = audioPlayer.paused ? 0 : NORMAL_SPEED_RAD;
                    spinVelocity += (targetVelocity - spinVelocity) * Math.min(1, deltaTime * 3);

                    if (audioPlayer.src && !audioPlayer.paused) {
                        let calculatedRate = Math.abs(spinVelocity / NORMAL_SPEED_RAD);
                        audioPlayer.playbackRate = Math.max(0.2, Math.min(calculatedRate, 5.0));
                    }

                    drawVinyl(currentRotation);
                    drawMiniVinyl(currentRotation);
                } else if (!audioPlayer.paused) {
                    currentRotation += NORMAL_SPEED_RAD * deltaTime;
                    audioPlayer.playbackRate = 1.0;
                    drawVinyl(currentRotation);
                    drawMiniVinyl(currentRotation);
                    spinVelocity = NORMAL_SPEED_RAD;
                } else {
                    drawVinyl(currentRotation);
                    drawMiniVinyl(currentRotation);
                }
            }

            requestAnimationFrame(mainLoop);
        }

        function seekAudio(value) {
            if (!audioPlayer.duration) return;
            audioPlayer.currentTime = (value / 100) * audioPlayer.duration;
        }

        function togglePlayPause() {
            if (!audioPlayer.src) return;
            if (audioPlayer.paused) {
                audioPlayer.playbackRate = 1.0;
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        }

        function playPrevTrack() {
            if (currentQueue.length === 0) return;
            let prevIndex = currentQueueIndex - 1;
            if (prevIndex < 0) prevIndex = currentQueue.length - 1;
            playQueueIndex(prevIndex);
        }

        function playNextTrack() {
            if (currentQueue.length === 0) return;
            let nextIndex = currentQueueIndex + 1;
            if (nextIndex >= currentQueue.length) nextIndex = 0;
            playQueueIndex(nextIndex);
        }

        function changeVolume(val) {
            audioPlayer.volume = val;
        }

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            
            Array.from(files).forEach(file => {
                window.jsmediatags.read(file, {
                    onSuccess: function(tag) {
                        const picture = tag.tags.picture;
                        let coverUrl = null;

                        if (picture) {
                            let base64String = "";
                            for (let i = 0; i < picture.data.length; i++) {
                                base64String += String.fromCharCode(picture.data[i]);
                            }
                            coverUrl = `data:${picture.format};base64,${window.btoa(base64String)}`;
                        }

                        file.arrayBuffer().then(arrayBuffer => {
                            const trackData = {
                                name: file.name,
                                fileData: arrayBuffer,
                                fileType: file.type,
                                cover: coverUrl
                            };

                            saveTrackToDB(trackData).then(id => {
                                const blob = new Blob([arrayBuffer], { type: file.type });
                                tracks.push({
                                    id: id,
                                    name: file.name,
                                    url: URL.createObjectURL(blob),
                                    cover: coverUrl
                                });

                                renderLibrary(searchInput.value);

                                if (currentTrackIndex === -1 && tracks.length > 0) {
                                    loadTrack(0);
                                }
                            });
                        });
                    },
                    onError: function() {
                        file.arrayBuffer().then(arrayBuffer => {
                            const trackData = {
                                name: file.name,
                                fileData: arrayBuffer,
                                fileType: file.type,
                                cover: null
                            };

                            saveTrackToDB(trackData).then(id => {
                                const blob = new Blob([arrayBuffer], { type: file.type });
                                tracks.push({
                                    id: id,
                                    name: file.name,
                                    url: URL.createObjectURL(blob),
                                    cover: null
                                });

                                renderLibrary(searchInput.value);

                                if (currentTrackIndex === -1 && tracks.length > 0) {
                                    loadTrack(0);
                                }
                            });
                        });
                    }
                });
            });
        });

        function renderLibrary(filterText = '') {
            if (tracks.length === 0) {
                libraryList.innerHTML = `<div class="empty-state">Your imported songs will appear here.</div>`;
                return;
            }

            const filteredTracks = tracks.map((track, originalIndex) => ({ track, originalIndex }))
                .filter(({ track }) => track.name.toLowerCase().includes(filterText.toLowerCase()));

            if (filteredTracks.length === 0) {
                libraryList.innerHTML = `<div class="empty-state">No matching songs found.</div>`;
                return;
            }

            libraryList.innerHTML = '';
            filteredTracks.forEach(({ track, originalIndex }) => {
                const item = document.createElement('div');
                item.className = `list-item ${track.id === currentTrackId ? 'active' : ''}`;

                const titleSpan = document.createElement('span');
                titleSpan.style.flex = '1';
                titleSpan.style.cursor = 'pointer';
                titleSpan.innerText = `🎵 ${track.name}`;
                titleSpan.addEventListener('click', () => loadTrack(originalIndex));
                item.appendChild(titleSpan);

                const actions = document.createElement('div');
                actions.className = 'track-item-actions';

                const addBtn = document.createElement('button');
                addBtn.className = 'add-to-playlist-btn';
                addBtn.title = 'Add to playlist';
                addBtn.innerText = '➕';
                addBtn.addEventListener('click', (e) => togglePlaylistMenu(e, track.id));
                actions.appendChild(addBtn);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.title = 'Delete song';
                deleteBtn.innerText = '✕';
                deleteBtn.addEventListener('click', () => deleteTrack(originalIndex));
                actions.appendChild(deleteBtn);

                item.appendChild(actions);
                libraryList.appendChild(item);
            });
        }

        function filterLibrary() {
            const query = searchInput.value;
            renderLibrary(query);
        }

        // --- PLAYLISTS ---

        function toggleNewPlaylistForm() {
            const form = document.getElementById('newPlaylistForm');
            form.classList.toggle('hidden');
            if (!form.classList.contains('hidden')) {
                document.getElementById('newPlaylistNameInput').focus();
            }
        }

        function submitNewPlaylist() {
            const input = document.getElementById('newPlaylistNameInput');
            const name = input.value.trim();
            if (!name) {
                alert('Please enter a playlist name.');
                return;
            }
            createPlaylist(name).then(() => {
                input.value = '';
                document.getElementById('newPlaylistForm').classList.add('hidden');
            });
        }

        function createPlaylist(name, trackIdToAdd = null) {
            const playlistData = { name: name, trackIds: trackIdToAdd ? [trackIdToAdd] : [] };
            return savePlaylistToDB(playlistData).then(id => {
                playlists.push({ id, name: playlistData.name, trackIds: playlistData.trackIds });
                renderPlaylists();
                return id;
            });
        }

        function deletePlaylist(playlistId) {
            if (!confirm('Delete this playlist? Your songs will not be deleted.')) return;
            deletePlaylistFromDB(playlistId).then(() => {
                playlists = playlists.filter(p => p.id !== playlistId);
                renderPlaylists();
            });
        }

        function removeTrackFromPlaylist(playlistId, trackId) {
            const playlist = playlists.find(p => p.id === playlistId);
            if (!playlist) return;
            playlist.trackIds = playlist.trackIds.filter(id => id !== trackId);
            updatePlaylistInDB(playlist).then(() => renderPlaylists());
        }

        function addTrackToPlaylist(playlistId, trackId) {
            const playlist = playlists.find(p => p.id === playlistId);
            if (!playlist) return;
            if (playlist.trackIds.includes(trackId)) {
                closePlaylistMenu();
                return;
            }
            playlist.trackIds.push(trackId);
            updatePlaylistInDB(playlist).then(() => {
                renderPlaylists();
                closePlaylistMenu();
            });
        }

        function resolvePlaylistTracks(playlist) {
            return playlist.trackIds
                .map(id => tracks.find(t => t.id === id))
                .filter(Boolean);
        }

        function renderPlaylists() {
            if (playlists.length === 0) {
                playlistsList.innerHTML = `<div class="empty-state">No playlists yet. Create one to get started.</div>`;
                return;
            }

            playlistsList.innerHTML = '';
            playlists.forEach(playlist => {
                const resolvedTracks = resolvePlaylistTracks(playlist);

                const card = document.createElement('div');
                card.className = 'playlist-card';

                const header = document.createElement('div');
                header.className = 'playlist-card-header';
                header.innerHTML = `
                    <div class="playlist-card-title">
                        <span class="playlist-name">${playlist.name}</span>
                        <span class="playlist-count">${resolvedTracks.length} track${resolvedTracks.length === 1 ? '' : 's'}</span>
                    </div>
                    <div class="playlist-card-actions">
                        <button class="pl-play-btn" title="Play playlist" ${resolvedTracks.length === 0 ? 'disabled' : ''}>▶</button>
                        <button class="pl-delete-btn" title="Delete playlist">🗑</button>
                    </div>
                `;
                header.querySelector('.pl-play-btn').addEventListener('click', () => {
                    if (resolvedTracks.length > 0) playPlaylistTrack(playlist.id, 0);
                });
                header.querySelector('.pl-delete-btn').addEventListener('click', () => deletePlaylist(playlist.id));
                card.appendChild(header);

                const trackContainer = document.createElement('div');
                trackContainer.className = 'playlist-tracks';

                if (resolvedTracks.length === 0) {
                    trackContainer.innerHTML = `<div class="empty-state playlist-empty">No tracks yet. Add songs from your Library.</div>`;
                } else {
                    resolvedTracks.forEach((track, queueIndex) => {
                        const row = document.createElement('div');
                        row.className = `list-item ${track.id === currentTrackId ? 'active' : ''}`;

                        const titleSpan = document.createElement('span');
                        titleSpan.style.flex = '1';
                        titleSpan.style.cursor = 'pointer';
                        titleSpan.innerText = `🎵 ${track.name}`;
                        titleSpan.addEventListener('click', () => playPlaylistTrack(playlist.id, queueIndex));
                        row.appendChild(titleSpan);

                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'delete-btn';
                        removeBtn.title = 'Remove from playlist';
                        removeBtn.innerText = '✕';
                        removeBtn.addEventListener('click', () => removeTrackFromPlaylist(playlist.id, track.id));
                        row.appendChild(removeBtn);

                        trackContainer.appendChild(row);
                    });
                }

                card.appendChild(trackContainer);
                playlistsList.appendChild(card);
            });
        }

        // --- Add-to-Playlist Popup Menu ---

        function closePlaylistMenu() {
            if (activePlaylistMenu) {
                activePlaylistMenu.remove();
                activePlaylistMenu = null;
                document.removeEventListener('click', handleOutsideMenuClick);
            }
        }

        function handleOutsideMenuClick(e) {
            if (activePlaylistMenu && !activePlaylistMenu.contains(e.target)) {
                closePlaylistMenu();
            }
        }

        function togglePlaylistMenu(e, trackId) {
            e.stopPropagation();
            if (activePlaylistMenu) {
                closePlaylistMenu();
                return;
            }

            const menu = document.createElement('div');
            menu.className = 'playlist-menu';

            if (playlists.length === 0) {
                const emptyItem = document.createElement('div');
                emptyItem.className = 'playlist-menu-empty';
                emptyItem.innerText = 'No playlists yet';
                menu.appendChild(emptyItem);
            } else {
                playlists.forEach(playlist => {
                    const already = playlist.trackIds.includes(trackId);
                    const menuItem = document.createElement('div');
                    menuItem.className = `playlist-menu-item${already ? ' already-added' : ''}`;
                    menuItem.innerText = already ? `✓ ${playlist.name}` : playlist.name;
                    menuItem.addEventListener('click', (evt) => {
                        evt.stopPropagation();
                        if (!already) addTrackToPlaylist(playlist.id, trackId);
                        else closePlaylistMenu();
                    });
                    menu.appendChild(menuItem);
                });
            }

            const newItem = document.createElement('div');
            newItem.className = 'playlist-menu-item playlist-menu-new';
            newItem.innerText = '+ New Playlist';
            newItem.addEventListener('click', (evt) => {
                evt.stopPropagation();
                const name = prompt('New playlist name:');
                if (name && name.trim()) {
                    createPlaylist(name.trim(), trackId).then(() => closePlaylistMenu());
                } else {
                    closePlaylistMenu();
                }
            });
            menu.appendChild(newItem);

            document.body.appendChild(menu);
            const btnRect = e.currentTarget.getBoundingClientRect();
            const menuWidth = 200;
            menu.style.top = `${btnRect.bottom + 4}px`;
            menu.style.left = `${Math.min(btnRect.left, window.innerWidth - menuWidth - 10)}px`;

            activePlaylistMenu = menu;
            setTimeout(() => document.addEventListener('click', handleOutsideMenuClick), 0);
        }

        // --- Playback ---

        function loadTrack(index) {
            currentQueue = tracks;
            playQueueIndex(index);
        }

        function playPlaylistTrack(playlistId, index) {
            const playlist = playlists.find(p => p.id === playlistId);
            if (!playlist) return;
            currentQueue = resolvePlaylistTracks(playlist);
            playQueueIndex(index);
        }

        function playQueueIndex(index) {
            const track = currentQueue[index];
            if (!track) return;

            if (!track.url) {
                alert("Track data not available.");
                return;
            }

            currentQueueIndex = index;
            currentTrackId = track.id;
            currentTrackIndex = tracks.findIndex(t => t.id === track.id);

            audioPlayer.src = track.url;
            audioPlayer.playbackRate = 1.0;
            nowPlayingText.innerText = '';
            fppTitle.innerText = track.name;
            renderLibrary(searchInput.value);
            renderPlaylists();

            currentRotation = 0;
            spinVelocity = NORMAL_SPEED_RAD;

            if (track.cover) {
                currentVinylImg = new Image();
                currentVinylImg.onload = () => {
                    drawVinyl(currentRotation);
                    drawMiniVinyl(currentRotation);
                };
                currentVinylImg.src = track.cover;
            } else {
                currentVinylImg = null;
                drawVinyl(currentRotation);
                drawMiniVinyl(currentRotation);
            }
        }

        function deleteTrack(index) {
            const track = tracks[index];
            const wasPlaying = track.id === currentTrackId;

            if (wasPlaying) {
                audioPlayer.pause();
                audioPlayer.src = '';
                nowPlayingText.innerText = '';
                fppTitle.innerText = 'No track playing';
                fppPlayPauseBtn.innerText = '▶';
                currentVinylImg = null;
                drawVinyl(0);
                drawMiniVinyl(0);
                currentTrackIndex = -1;
                currentTrackId = null;
                currentQueue = [];
                currentQueueIndex = -1;
            } else if (currentTrackIndex > index) {
                currentTrackIndex--;
            }

            deleteTrackFromDB(track.id).then(() => {
                tracks.splice(index, 1);

                let playlistsChanged = false;
                playlists.forEach(pl => {
                    const before = pl.trackIds.length;
                    pl.trackIds = pl.trackIds.filter(id => id !== track.id);
                    if (pl.trackIds.length !== before) playlistsChanged = true;
                });

                const updateDone = playlistsChanged
                    ? Promise.all(playlists.map(pl => updatePlaylistInDB(pl)))
                    : Promise.resolve();

                updateDone.then(() => {
                    renderLibrary(searchInput.value);
                    renderPlaylists();
                });
            });
        }

        function getAngle(x, y) {
            return Math.atan2(y - CENTER, x - CENTER);
        }

        // --- Mouse & Touch Scratch/Drag Event Handlers ---
        
        function handleDragStart(clientX, clientY, rect) {
            isDragging = true;
            spinVelocity = 0; 
            canvas.classList.add('is-dragging');
            lastAngle = getAngle(clientX - rect.left, clientY - rect.top);
            lastTime = performance.now();
        }

        function handleDragMove(clientX, clientY, rect) {
            if (!isDragging || !audioPlayer.src) return;

            const currentTime = performance.now();
            const currentMouseAngle = getAngle(clientX - rect.left, clientY - rect.top);
            
            let deltaAngle = currentMouseAngle - lastAngle;
            if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
            if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;

            currentRotation += deltaAngle;
            drawVinyl(currentRotation);
            drawMiniVinyl(currentRotation);

            const timeDelta = currentTime - lastTime;
            if (timeDelta > 0) {
                spinVelocity = deltaAngle / (timeDelta / 1000);
                
                if (!audioPlayer.paused) {
                    let calculatedRate = Math.abs(spinVelocity / NORMAL_SPEED_RAD);
                    audioPlayer.playbackRate = Math.max(0.2, Math.min(calculatedRate, 5.0));
                }
            }

            const seekSeconds = deltaAngle * (4 / Math.PI);
            let newTime = audioPlayer.currentTime + seekSeconds;
            audioPlayer.currentTime = Math.max(0, Math.min(newTime, audioPlayer.duration));

            if (audioPlayer.duration) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                seekSlider.value = progressPercent;
                currentTimeText.innerText = formatTime(audioPlayer.currentTime);
            }

            lastAngle = currentMouseAngle;
            lastTime = currentTime;
        }

        function handleDragEnd() {
            if (isDragging) {
                isDragging = false;
                canvas.classList.remove('is-dragging');
            }
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            handleDragStart(e.clientX, e.clientY, rect);
        });
        window.addEventListener('mouseup', handleDragEnd);
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            handleDragMove(e.clientX, e.clientY, rect);
        });

        // Touch Events for Mobile
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                handleDragStart(e.touches[0].clientX, e.touches[0].clientY, rect);
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', handleDragEnd);
        
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                handleDragMove(e.touches[0].clientX, e.touches[0].clientY, rect);
                e.preventDefault();
            }
        }, { passive: false });

        init();
    </script>
</body>
