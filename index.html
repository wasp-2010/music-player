<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music player</title>
    <!-- Include jsmediatags to parse embedded album art/metadata from audio files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        /* Default Dark Theme Variables */
        :root {
            --bg-base: #111;
            --bg-card: #181818;
            --bg-hover: #282828;
            --turntable-bg: #151515;
            --accent: #ff4747;
            --text-main: #eee;
            --text-sub: #888;
            --border-color: #222;
        }

        /* Light Theme Variables */
        body.light-mode {
            --bg-base: #f4f4f6;
            --bg-card: #ffffff;
            --bg-hover: #e5e5ea;
            --turntable-bg: #e2e2e6;
            --accent: #ff3b30;
            --text-main: #111111;
            --text-sub: #666666;
            --border-color: #d1d1d6;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Auth Overlay Screen */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-overlay.hidden { display: none; }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            width: 340px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        .auth-card h2 {
            margin: 0 0 10px 0;
            color: var(--accent);
        }

        .auth-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .auth-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .auth-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .auth-btn:hover { opacity: 0.9; }

        .auth-switch {
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
        }
        .auth-switch span {
            color: var(--accent);
            font-weight: bold;
        }
        .auth-switch span:hover { text-decoration: underline; }

        /* Left Column: The Turntable */
        .turntable-section {
            width: 45%;
            background: var(--turntable-bg);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s;
        }

        #vinylCanvas {
            position: absolute;
            left: -175px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            border-radius: 50%;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        #vinylCanvas.is-dragging { cursor: grabbing; }

        .now-playing-label {
            position: absolute;
            bottom: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
            text-align: center;
            padding: 0 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
            z-index: 10;
        }

        /* Right Column: Navigation & Content */
        .content-section {
            width: 55%;
            padding: 30px 30px 140px 30px;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            transition: background 0.3s;
            box-sizing: border-box;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--text-main);
            color: var(--bg-base);
            border-color: var(--text-main);
        }
        .tab-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        /* Pill Import Button */
        .import-pill-btn {
            background: #f0f0f2;
            color: #111;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.15s, background 0.2s;
        }
        body.light-mode .import-pill-btn {
            background: #e5e5ea;
            color: #111;
        }
        .import-pill-btn:hover {
            transform: scale(1.03);
            background: var(--accent);
            color: #fff;
        }
        .hidden-file-input { display: none; }

        /* Small Circle Theme Toggle Button */
        .theme-circle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .theme-circle-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent);
        }

        /* User Profile Pill in Header */
        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .logout-link {
            color: var(--accent);
            cursor: pointer;
            font-weight: bold;
            background: none;
            border: none;
            padding: 0;
        }
        .logout-link:hover { text-decoration: underline; }

        /* Dynamic View Container */
        .view-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, border-color 0.3s;
        }

        .view-pane { display: none; flex: 1; flex-direction: column; }
        .view-pane.active { display: flex; }

        /* Search Input */
        .search-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Track List Items */
        .track-list {
            flex: 1;
            overflow-y: auto;
        }

        .list-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .list-item:hover { background: var(--bg-hover); }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.9rem;
        }
        .delete-btn:hover { color: var(--accent); }

        /* Floating Pill Player Widget */
        .floating-pill-player {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(24, 24, 24, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 16px 24px 16px 80px;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1000;
            color: #fff;
            transition: background 0.3s, border-color 0.3s;
            overflow: visible;
        }

        body.light-mode .floating-pill-player {
            background: rgba(255, 255, 255, 0.95);
            color: #111;
        }

        .fpp-artwork-container {
            position: absolute;
            left: -55px;
            top: 50%;
            transform: translateY(-50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            box-shadow: -5px 5px 20px rgba(0,0,0,0.5);
            cursor: grab;
        }
        .fpp-artwork-container.is-dragging { cursor: grabbing; }

        #fppVinylCanvas {
            border-radius: 50%;
            display: block;
        }

        .fpp-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .fpp-top-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .fpp-title {
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fpp-subtitle {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fpp-seek-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .fpp-seekbar {
            width: 100%;
            -webkit-appearance: none;
            background: #444;
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .fpp-times {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .fpp-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .fpp-btn {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            opacity: 0.8;
            transition: opacity 0.15s, transform 0.15s, color 0.15s;
        }
        .fpp-btn:hover {
            opacity: 1;
            color: var(--accent);
            transform: scale(1.1);
        }

        .fpp-play-btn {
            background: var(--text-main);
            color: var(--bg-base);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            opacity: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .fpp-play-btn:hover {
            background: var(--accent);
            color: #fff;
            transform: scale(1.05);
        }

        .fpp-volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }
        .fpp-volume-slider {
            width: 60px;
            -webkit-appearance: none;
            background: #444;
            height: 3px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION OVERLAY -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h2 id="authTitle">Welcome Back</h2>
            <input type="text" id="authUsername" class="auth-input" placeholder="Username">
            <input type="password" id="authPassword" class="auth-input" placeholder="Password">
            <button class="auth-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">Log In</button>
            <div class="auth-switch" id="authSwitchText" onclick="toggleAuthMode()">
                Don't have an account? <span>Sign Up</span>
            </div>
        </div>
    </div>

    <!-- LEFT: TURNTABLE WITH BIG HALF-HIDDEN VINYL -->
    <div class="turntable-section">
        <canvas id="vinylCanvas" width="600" height="600"></canvas>
        <div class="now-playing-label" id="nowPlayingText">No track selected</div>
    </div>

    <!-- RIGHT: NAVIGATION TABS & CONTENT -->
    <div class="content-section">
        <div class="nav-header">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('library')">Library</button>
                <button class="tab-btn" onclick="switchTab('albums')">Albums</button>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <!-- Small Import Pill Button -->
                <label class="import-pill-btn">
                    + IMPORT MUSIC
                    <input type="file" id="fileInput" class="hidden-file-input" accept="audio/*" multiple>
                </label>
                <div class="user-profile-widget" id="userProfileWidget">
                    👤 <span id="loggedUserText">User</span>
                    <button class="logout-link" onclick="logoutUser()">Log Out</button>
                </div>
                <!-- Small Circle Theme Toggle Button -->
                <button class="theme-circle-btn" onclick="toggleTheme()" id="themeToggleBtn" title="Toggle Theme">☀️</button>
            </div>
        </div>

        <div class="view-container">
            <!-- LIBRARY VIEW -->
            <div id="libraryView" class="view-pane active">
                <!-- Search Input Bar -->
                <input type="text" id="searchInput" class="search-input" placeholder="Search your imported songs..." oninput="filterLibrary()">

                <div id="libraryList" class="track-list">
                    <div class="empty-state">Your imported songs will appear here.</div>
                </div>
            </div>

            <!-- ALBUMS VIEW -->
            <div id="albumsView" class="view-pane">
                <div id="albumsList" style="flex: 1; overflow-y: auto;">
                    <div class="empty-state">No custom albums created yet.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING PILL PLAYER WIDGET WITH HALF-HIDDEN VINYL -->
    <div class="floating-pill-player">
        <div class="fpp-artwork-container" id="fppArtworkContainer">
            <canvas id="fppVinylCanvas" width="130" height="130"></canvas>
        </div>
        <div class="fpp-content">
            <div class="fpp-top-info">
                <span class="fpp-title" id="fppTitle">No track playing</span>
                <span class="fpp-subtitle">BLAZE VINYL RECORDS</span>
            </div>
            <div class="fpp-seek-container">
                <input type="range" id="seekSlider" class="fpp-seekbar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
                <div class="fpp-times">
                    <span id="currentTimeText">0:00</span>
                    <span id="durationText">0:00</span>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="fpp-controls">
                    <button class="fpp-btn" onclick="playPrevTrack()" title="Previous">⏮</button>
                    <button class="fpp-btn fpp-play-btn" onclick="togglePlayPause()" id="fppPlayPauseBtn" title="Play/Pause">▶</button>
                    <button class="fpp-btn" onclick="playNextTrack()" title="Next">⏭</button>
                </div>
                <div class="fpp-volume-container">
                    <span style="font-size: 0.75rem;">🔊</span>
                    <input type="range" min="0" max="1" step="0.01" value="1" class="fpp-volume-slider" oninput="changeVolume(this.value)">
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioPlayer"></audio>

    <script>
        const canvas = document.getElementById('vinylCanvas');
        const ctx = canvas.getContext('2d');
        const fppCanvas = document.getElementById('fppVinylCanvas');
        const fppCtx = fppCanvas.getContext('2d');

        const audioPlayer = document.getElementById('audioPlayer');
        const fileInput = document.getElementById('fileInput');
        const searchInput = document.getElementById('searchInput');
        const libraryList = document.getElementById('libraryList');
        const albumsList = document.getElementById('albumsList');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const fppTitle = document.getElementById('fppTitle');
        const fppPlayPauseBtn = document.getElementById('fppPlayPauseBtn');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeText = document.getElementById('currentTimeText');
        const durationText = document.getElementById('durationText');

        const authOverlay = document.getElementById('authOverlay');
        const authTitle = document.getElementById('authTitle');
        const authUsername = document.getElementById('authUsername');
        const authPassword = document.getElementById('authPassword');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authSwitchText = document.getElementById('authSwitchText');
        const loggedUserText = document.getElementById('loggedUserText');

        const CANVAS_SIZE = 600;
        const CENTER = CANVAS_SIZE / 2;
        const OUTER_RADIUS = 280;
        const LABEL_RADIUS = 90;

        let db = null;
        let isSignUpMode = false;
        let currentUser = null;
        let tracks = [];
        let albums = [];
        let currentTrackIndex = -1;
        
        let isDragging = false;
        let lastAngle = 0;
        let lastTime = 0;
        let spinVelocity = 0;
        let currentRotation = 0;
        const NORMAL_SPEED_RAD = (Math.PI * 2 * (180 / 360)); 
        let currentVinylImg = null;
        let lastFrameTime = performance.now();

        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('MusicPlayerDB', 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('tracks')) {
                        database.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        async function init() {
            drawVinyl(0);
            drawMiniVinyl(0);
            setupAudioListeners();
            await initIndexedDB();
            checkExistingSession();
            requestAnimationFrame(mainLoop);
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                authTitle.innerText = "Create Account";
                authSubmitBtn.innerText = "Sign Up";
                authSwitchText.innerHTML = "Already have an account? <span>Log In</span>";
            } else {
                authTitle.innerText = "Welcome Back";
                authSubmitBtn.innerText = "Log In";
                authSwitchText.innerHTML = "Don't have an account? <span>Sign Up</span>";
            }
        }

        function handleAuthSubmit() {
            const user = authUsername.value.trim();
            const pass = authPassword.value.trim();

            if (!user || !pass) {
                alert("Please fill in both fields.");
                return;
            }

            let usersDB = JSON.parse(localStorage.getItem('musicPlayerUsers') || '{}');

            if (isSignUpMode) {
                if (usersDB[user]) {
                    alert("Username already exists. Choose another or log in.");
                    return;
                }
                usersDB[user] = pass;
                localStorage.setItem('musicPlayerUsers', JSON.stringify(usersDB));
                alert("Account created successfully! You are now logged in.");
            } else {
                if (!usersDB[user]) {
                    alert("Account not found. Please Sign Up first.");
                    return;
                }
                if (usersDB[user] !== pass) {
                    alert("Invalid password.");
                    return;
                }
            }

            currentUser = user;
            localStorage.setItem('musicPlayerActiveUser', currentUser);
            authUsername.value = '';
            authPassword.value = '';
            authOverlay.classList.add('hidden');
            loggedUserText.innerText = currentUser;
            loadUserData();
        }

        function checkExistingSession() {
            const active = localStorage.getItem('musicPlayerActiveUser');
            if (active) {
                currentUser = active;
                authOverlay.classList.add('hidden');
                loggedUserText.innerText = currentUser;
                loadUserData();
            } else {
                authOverlay.classList.remove('hidden');
            }
        }

        function logoutUser() {
            audioPlayer.pause();
            audioPlayer.src = '';
            currentUser = null;
            localStorage.removeItem('musicPlayerActiveUser');
            tracks = [];
            albums = [];
            currentTrackIndex = -1;
            currentVinylImg = null;
            nowPlayingText.innerText = 'No track selected';
            fppTitle.innerText = 'No track playing';
            renderLibrary();
            renderAlbums();
            drawVinyl(0);
            drawMiniVinyl(0);
            authOverlay.classList.remove('hidden');
        }

        function saveTrackToDB(trackData) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['tracks'], 'readwrite');
                const store = transaction.objectStore('tracks');
                trackData.user = currentUser;
                const request = store.add(trackData);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function loadUserData() {
            if (!currentUser || !db) return;
            const transaction = db.transaction(['tracks'], 'readonly');
            const store = transaction.objectStore('tracks');
            const request = store.getAll();

            request.onsuccess = () => {
                const allTracks = request.result;
                tracks = allTracks.filter(t => t.user === currentUser).map(t => {
                    const blob = new Blob([t.fileData], { type: t.fileType });
                    return {
                        id: t.id,
                        name: t.name,
                        cover: t.cover,
                        url: URL.createObjectURL(blob)
                    };
                });
                buildDefaultAlbum();
                renderLibrary();
                renderAlbums();
            };
        }

        function deleteTrackFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['tracks'], 'readwrite');
                const store = transaction.objectStore('tracks');
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                themeToggleBtn.innerText = '🌙';
            } else {
                themeToggleBtn.innerText = '☀️';
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn !== themeToggleBtn) btn.classList.remove('active');
            });
            document.querySelectorAll('.view-pane').forEach(pane => pane.classList.remove('active'));

            if (tabName === 'library') {
                document.querySelector('.tab-buttons button:nth-child(1)').classList.add('active');
                document.getElementById('libraryView').classList.add('active');
            } else {
                document.querySelector('.tab-buttons button:nth-child(2)').classList.add('active');
                document.getElementById('albumsView').classList.add('active');
            }
        }

        function drawVinyl(rotation) {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, OUTER_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#222';
            ctx.stroke();

            ctx.beginPath();
            for(let i = LABEL_RADIUS + 25; i < OUTER_RADIUS - 15; i += 8) {
                 ctx.arc(CENTER, CENTER, i, 0, Math.PI * 2);
            }
            ctx.stroke();

            ctx.save();
            ctx.translate(CENTER, CENTER);
            ctx.rotate(rotation);

            ctx.beginPath();
            ctx.arc(0, 0, LABEL_RADIUS, 0, Math.PI * 2);
            ctx.clip();

            if (currentVinylImg && currentVinylImg.complete) {
                ctx.drawImage(currentVinylImg, -LABEL_RADIUS, -LABEL_RADIUS, LABEL_RADIUS * 2, LABEL_RADIUS * 2);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-LABEL_RADIUS, -LABEL_RADIUS, LABEL_RADIUS * 2, LABEL_RADIUS * 2);
            }
            ctx.restore();

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, LABEL_RADIUS, 0, Math.PI * 2);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ddd';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.strokeStyle = '#444';
            ctx.stroke();
        }

        function drawMiniVinyl(rotation) {
            const size = 130;
            const center = size / 2;
            const outerR = 62;
            const labelR = 24;

            fppCtx.clearRect(0, 0, size, size);

            fppCtx.beginPath();
            fppCtx.arc(center, center, outerR, 0, Math.PI * 2);
            fppCtx.fillStyle = '#111';
            fppCtx.fill();
            fppCtx.lineWidth = 1.5;
            fppCtx.strokeStyle = '#333';
            fppCtx.stroke();

            fppCtx.beginPath();
            for(let i = labelR + 8; i < outerR - 5; i += 4) {
                 fppCtx.arc(center, center, i, 0, Math.PI * 2);
            }
            fppCtx.stroke();

            fppCtx.save();
            fppCtx.translate(center, center);
            fppCtx.rotate(rotation);
            fppCtx.beginPath();
            fppCtx.arc(0, 0, labelR, 0, Math.PI * 2);
            fppCtx.clip();

            if (currentVinylImg && currentVinylImg.complete) {
                fppCtx.drawImage(currentVinylImg, -labelR, -labelR, labelR * 2, labelR * 2);
            } else {
                fppCtx.fillStyle = '#ffffff';
                fppCtx.fillRect(-labelR, -labelR, labelR * 2, labelR * 2);
            }
            fppCtx.restore();

            fppCtx.beginPath();
            fppCtx.arc(center, center, labelR, 0, Math.PI * 2);
            fppCtx.lineWidth = 1.5;
            fppCtx.strokeStyle = '#ddd';
            fppCtx.stroke();

            fppCtx.beginPath();
            fppCtx.arc(center, center, 4, 0, Math.PI * 2);
            fppCtx.fill();
            fppCtx.strokeStyle = '#444';
            fppCtx.stroke();
        }

        function setupAudioListeners() {
            audioPlayer.addEventListener('loadedmetadata', () => {
                audioPlayer.play();
                fppPlayPauseBtn.innerText = '⏸';
            });
            audioPlayer.addEventListener('play', () => {
                fppPlayPauseBtn.innerText = '⏸';
            });
            audioPlayer.addEventListener('pause', () => {
                fppPlayPauseBtn.innerText = '▶';
            });
            audioPlayer.addEventListener('ended', playNextTrack);
        }

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function mainLoop(timestamp) {
            const deltaTime = (timestamp - lastFrameTime) / 1000;
            lastFrameTime = timestamp;

            if (audioPlayer.duration && !audioPlayer.paused && !isDragging) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                seekSlider.value = progressPercent;
                currentTimeText.innerText = formatTime(audioPlayer.currentTime);
                durationText.innerText = formatTime(audioPlayer.duration);
            }

            if (isDragging) {
                // Handled via mousemove event
            } else if (Math.abs(spinVelocity) > 0.01) {
                currentRotation += spinVelocity * deltaTime;
                const targetVelocity = audioPlayer.paused ? 0 : NORMAL_SPEED_RAD;
                spinVelocity += (targetVelocity - spinVelocity) * Math.min(1, deltaTime * 3);

                if (audioPlayer.src && !audioPlayer.paused) {
                    let calculatedRate = Math.abs(spinVelocity / NORMAL_SPEED_RAD);
                    audioPlayer.playbackRate = Math.max(0.2, Math.min(calculatedRate, 5.0));
                }

                drawVinyl(currentRotation);
                drawMiniVinyl(currentRotation);
            } else if (!audioPlayer.paused) {
                currentRotation += NORMAL_SPEED_RAD * deltaTime;
                audioPlayer.playbackRate = 1.0;
                drawVinyl(currentRotation);
                drawMiniVinyl(currentRotation);
                spinVelocity = NORMAL_SPEED_RAD;
            } else {
                drawVinyl(currentRotation);
                drawMiniVinyl(currentRotation);
            }

            requestAnimationFrame(mainLoop);
        }

        function seekAudio(value) {
            if (!audioPlayer.duration) return;
            audioPlayer.currentTime = (value / 100) * audioPlayer.duration;
        }

        function togglePlayPause() {
            if (!audioPlayer.src) return;
            if (audioPlayer.paused) {
                audioPlayer.playbackRate = 1.0;
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        }

        function playPrevTrack() {
            if (tracks.length === 0) return;
            let prevIndex = currentTrackIndex - 1;
            if (prevIndex < 0) prevIndex = tracks.length - 1;
            loadTrack(prevIndex);
        }

        function playNextTrack() {
            if (tracks.length === 0) return;
            let nextIndex = currentTrackIndex + 1;
            if (nextIndex >= tracks.length) nextIndex = 0;
            loadTrack(nextIndex);
        }

        function changeVolume(val) {
            audioPlayer.volume = val;
        }

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            
            Array.from(files).forEach(file => {
                window.jsmediatags.read(file, {
                    onSuccess: function(tag) {
                        const picture = tag.tags.picture;
                        let coverUrl = null;

                        if (picture) {
                            let base64String = "";
                            for (let i = 0; i < picture.data.length; i++) {
                                base64String += String.fromCharCode(picture.data[i]);
                            }
                            coverUrl = `data:${picture.format};base64,${window.btoa(base64String)}`;
                        }

                        file.arrayBuffer().then(arrayBuffer => {
                            const trackData = {
                                name: file.name,
                                fileData: arrayBuffer,
                                fileType: file.type,
                                cover: coverUrl
                            };

                            saveTrackToDB(trackData).then(id => {
                                const blob = new Blob([arrayBuffer], { type: file.type });
                                tracks.push({
                                    id: id,
                                    name: file.name,
                                    url: URL.createObjectURL(blob),
                                    cover: coverUrl
                                });

                                buildDefaultAlbum();
                                renderLibrary(searchInput.value);
                                renderAlbums();

                                if (currentTrackIndex === -1 && tracks.length > 0) {
                                    loadTrack(0);
                                }
                            });
                        });
                    },
                    onError: function() {
                        file.arrayBuffer().then(arrayBuffer => {
                            const trackData = {
                                name: file.name,
                                fileData: arrayBuffer,
                                fileType: file.type,
                                cover: null
                            };

                            saveTrackToDB(trackData).then(id => {
                                const blob = new Blob([arrayBuffer], { type: file.type });
                                tracks.push({
                                    id: id,
                                    name: file.name,
                                    url: URL.createObjectURL(blob),
                                    cover: null
                                });

                                buildDefaultAlbum();
                                renderLibrary(searchInput.value);
                                renderAlbums();

                                if (currentTrackIndex === -1 && tracks.length > 0) {
                                    loadTrack(0);
                                }
                            });
                        });
                    }
                });
            });
        });

        function buildDefaultAlbum() {
            albums = [{ name: 'Imported Library', tracks: [...tracks] }];
        }

        function renderLibrary(filterText = '') {
            if (tracks.length === 0) {
                libraryList.innerHTML = `<div class="empty-state">Your imported songs will appear here.</div>`;
                return;
            }

            const filteredTracks = tracks.map((track, originalIndex) => ({ track, originalIndex }))
                .filter(({ track }) => track.name.toLowerCase().includes(filterText.toLowerCase()));

            if (filteredTracks.length === 0) {
                libraryList.innerHTML = `<div class="empty-state">No matching songs found.</div>`;
                return;
            }

            libraryList.innerHTML = '';
            filteredTracks.forEach(({ track, originalIndex }) => {
                const item = document.createElement('div');
                item.className = `list-item ${originalIndex === currentTrackIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <span onclick="loadTrack(${originalIndex})" style="flex:1;">🎵 ${track.name}</span>
                    <button class="delete-disc" onclick="deleteTrack(${originalIndex})">✕</button>
                `;
                item.querySelector('.delete-disc').className = 'delete-btn';
                libraryList.appendChild(item);
            });
        }

        function filterLibrary() {
            const query = searchInput.value;
            renderLibrary(query);
        }

        function renderAlbums() {
            if (albums.length === 0 || tracks.length === 0) {
                albumsList.innerHTML = `<div class="empty-state">No custom albums created yet.</div>`;
                return;
            }
            albumsList.innerHTML = '';
            albums.forEach(album => {
                const albumCard = document.createElement('div');
                albumCard.style.marginBottom = '15px';
                albumCard.innerHTML = `<h4 style="margin: 5px 0 10px 0; color: var(--accent);">${album.name} (${album.tracks.length} tracks)</h4>`;
                
                album.tracks.forEach((track) => {
                    const trackRow = document.createElement('div');
                    trackRow.className = 'list-item';
                    trackRow.innerHTML = `<span>💿 ${track.name}</span>`;
                    albumCard.appendChild(trackRow);
                });
                albumsList.appendChild(albumCard);
            });
        }

        function loadTrack(index) {
            currentTrackIndex = index;
            const track = tracks[index];
            
            if (!track.url) {
                alert("Track data not available.");
                return;
            }

            audioPlayer.src = track.url;
            audioPlayer.playbackRate = 1.0;
            nowPlayingText.innerText = track.name;
            fppTitle.innerText = track.name;
            renderLibrary(searchInput.value);
            
            currentRotation = 0;
            spinVelocity = NORMAL_SPEED_RAD;

            if (track.cover) {
                currentVinylImg = new Image();
                currentVinylImg.onload = () => {
                    drawVinyl(currentRotation);
                    drawMiniVinyl(currentRotation);
                };
                currentVinylImg.src = track.cover;
            } else {
                currentVinylImg = null;
                drawVinyl(currentRotation);
                drawMiniVinyl(currentRotation);
            }
        }

        function deleteTrack(index) {
            const track = tracks[index];
            if (currentTrackIndex === index) {
                audioPlayer.pause();
                audioPlayer.src = '';
                nowPlayingText.innerText = 'No track selected';
                fppTitle.innerText = 'No track playing';
                fppPlayPauseBtn.innerText = '▶';
                currentVinylImg = null;
                drawVinyl(0);
                drawMiniVinyl(0);
                currentTrackIndex = -1;
            } else if (currentTrackIndex > index) {
                currentTrackIndex--;
            }

            deleteTrackFromDB(track.id).then(() => {
                tracks.splice(index, 1);
                buildDefaultAlbum();
                renderLibrary(searchInput.value);
                renderAlbums();
            });
        }

        function getAngle(x, y) {
            return Math.atan2(y - CENTER, x - CENTER);
        }

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            spinVelocity = 0; 
            if (audioPlayer.src) {
                audioPlayer.play();
                fppPlayPauseBtn.innerText = '⏸';
            }
            canvas.classList.add('is-dragging');
            const rect = canvas.getBoundingClientRect();
            lastAngle = getAngle(e.clientX - rect.left, e.clientY - rect.top);
            lastTime = performance.now();
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                canvas.classList.remove('is-dragging');
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || !audioPlayer.src) return;

            const rect = canvas.getBoundingClientRect();
            const currentTime = performance.now();
            const currentMouseAngle = getAngle(e.clientX - rect.left, e.clientY - rect.top);
            
            let deltaAngle = currentMouseAngle - lastAngle;
            if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
            if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;

            currentRotation += deltaAngle;
            drawVinyl(currentRotation);
            drawMiniVinyl(currentRotation);

            const timeDelta = currentTime - lastTime;
            if (timeDelta > 0) {
                spinVelocity = deltaAngle / (timeDelta / 1000);
                let calculatedRate = Math.abs(spinVelocity / NORMAL_SPEED_RAD);
                audioPlayer.playbackRate = Math.max(0.2, Math.min(calculatedRate, 5.0));
            }

            const deltaDegrees = deltaAngle * (180 / Math.PI);
            const seekSeconds = deltaDegrees / 90;
            let newTime = audioPlayer.currentTime + seekSeconds;
            audioPlayer.currentTime = Math.max(0, Math.min(newTime, audioPlayer.duration));

            lastAngle = currentMouseAngle;
            lastTime = currentTime;
        });

        init();
    </script>
</body>
